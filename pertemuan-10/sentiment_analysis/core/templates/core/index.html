<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: rgba(255, 255, 255, 0.7);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --primary-color: #007aff;
            --text-color: #333;
            --border-radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            /* A subtle gradient background */
            background-image: linear-gradient(135deg, #a8e0ff 0%, #f0f4f8 100%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            /* This is the "glassmorphism" effect */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 var(--shadow-color);
            padding: 2.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 12px 40px 0 var(--shadow-color);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .header h2 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 600;
        }

        /* Simple SVG icon for the header */
        .header-icon {
            width: 32px;
            height: 32px;
            fill: var(--primary-color);
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            box-sizing: border-box; /* Important for padding to work */
            resize: vertical;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
            outline: none;
        }

        .analyze-button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.9rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            width: 100%;
            transition: background-color 0.3s, transform 0.2s;
        }

        .analyze-button:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .result {
            margin-top: 2rem;
            padding: 1.25rem;
            border-radius: var(--border-radius);
            text-align: left;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result p {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Result icons */
        .result-icon {
            width: 24px;
            height: 24px;
        }
        
        /* Specific styles for Positive result */
        .positive {
            background-color: rgba(45, 211, 111, 0.1);
            border: 1px solid rgba(45, 211, 111, 0.3);
            color: #1a7440;
        }
        .positive .result-icon {
            fill: #2dd36f;
        }

        /* Specific styles for Negative result */
        .negative {
            background-color: rgba(235, 87, 87, 0.1);
            border: 1px solid rgba(235, 87, 87, 0.3);
            color: #a82a2a;
        }
        .negative .result-icon {
            fill: #eb5757;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2v2h-4V4a2 2 0 0 1 2-2zM6.5 8C5.67 8 5 7.33 5 6.5S5.67 5 6.5 5 8 5.67 8 6.5 7.33 8 6.5 8zM17.5 8c-.83 0-1.5-.67-1.5-1.5S16.67 5 17.5 5 19 5.67 19 6.5 18.33 8 17.5 8zM20 10v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1-2-2V4a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v4a2 2 0 0 1-2 2zm-2 0H6v10h12V10zM10 12v6h4v-6h-4z"/></svg>
                <h2>Sentiment Analysis</h2>
            </div>
            
            <p style="margin-top:0; margin-bottom: 2rem; color: #555;">
                Enter a movie review to see if its sentiment is positive or negative.
            </p>

            <form method="POST">
                {% csrf_token %}
                <textarea name="review_text" placeholder="e.g., The movie was fantastic!">{% if review %}{{ review }}{% endif %}</textarea>
                <button type="submit" class="analyze-button">Analyze</button>
            </form>

            {% if sentiment %}
                <div class="result {{ sentiment }}">
                    {% if sentiment == 'positive' %}
                        <p>
                            <svg class="result-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.24 9.38-5.3 5.3c-.39.39-1.02.39-1.41 0L7 14.17l1.41-1.41 2.12 2.12 3.89-3.89c.39-.39 1.02-.39 1.41 0 .39.39.39 1.03 0 1.41z"/></svg>
                            The sentiment is: <strong>Positive</strong>
                        </p>
                    {% else %}
                        <p>
                            <svg class="result-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                            The sentiment is: <strong>Negative</strong>
                        </p>
                    {% endif %}
                </div>
            {% endif %}

        </div>
    </div>

</body>
</html>
